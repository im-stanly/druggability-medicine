pocket_labeling:
  # Pocket is labeled druggable (1) if it's within this distance to at least one ligand centroid
  max_ligand_distance_angstrom: 6.0

pocket_featurization:
  # Radius for collecting protein atoms around a pocket centroid
  neighborhood_radius_angstrom: 6.0

pocket_model:
  test_size: 0.2
  random_state: 42
  xgb:
    # Optimized hyperparameters for imbalanced classification with class weighting
    # Increased estimators and learning rate for better convergence with class weights
    n_estimators: 500
    max_depth: 6
    learning_rate: 0.08
    subsample: 0.85
    colsample_bytree: 0.85
    colsample_bylevel: 0.85
    # Regularization: increased to prevent overfitting
    reg_lambda: 2.0
    reg_alpha: 0.5
    # Key for imbalanced data: scale_pos_weight helps balance minority class
    # But we use sample weights instead, so this can be kept at 1.0
    scale_pos_weight: 1.0
    # Tree-specific improvements
    min_child_weight: 3
    gamma: 0.5
    # Sampling improvements
    subsample_freq: 1
    # Numerical stability
    tree_method: 'hist'
    n_jobs: 4
