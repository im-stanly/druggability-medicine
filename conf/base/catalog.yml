# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog

raw_protein_cifs:
  type: kedro_datasets.partitions.PartitionedDataset
  path: data/01_raw/proteins/
  dataset: druggability.datasets.path_dataset.PathDataset
  filename_suffix: .cif.gz

intermediate_protein_cifs:
  type: kedro_datasets.partitions.PartitionedDataset
  path: data/02_intermediate/proteins/
  dataset: text.TextDataset
  filename_suffix: .cif

protein_structure_dataset:
  type: druggability.datasets.protein_dataset.MmcifPairedDataset
  root_path: data/02_intermediate/proteins/

protein_ligand_dataset:
    type: druggability.datasets.protein_ligand_dataset.ProteinLigandPairsDataset
    root_path: data/01_raw/protein_ligand_raw/

p2rank_pockets:
  type: pandas.CSVDataset
  filepath: data/08_reporting/p2rank_pockets.csv
  save_args:
    index: false

labeled_pockets:
  type: pandas.CSVDataset
  filepath: data/08_reporting/labeled_pockets.csv
  save_args:
    index: false

pocket_features:
  type: pandas.CSVDataset
  filepath: data/08_reporting/pocket_features.csv
  save_args:
    index: false

pocket_model_metrics:
  type: json.JSONDataset
  filepath: data/08_reporting/pocket_model_metrics.json

pocket_xgb_model:
  type: pickle.PickleDataset
  filepath: data/06_models/pocket_xgb_model.pkl

pocket_train_table:
  type: pandas.CSVDataset
  filepath: data/05_model_input/pocket_train_table.csv
  save_args:
    index: false

pocket_test_table:
  type: pandas.CSVDataset
  filepath: data/05_model_input/pocket_test_table.csv
  save_args:
    index: false

pocket_roc_curve:
  type: matplotlib.MatplotlibDataset
  filepath: data/08_reporting/pocket_roc_curve.png

matched_protein_pairs_dataset:
  type: druggability.datasets.protein_dataset.MmcifPairedDataset
  root_path: data/03_primary/matched_protein_pairs/

protein_alignment_results_dataset:
  type: pandas.CSVDataset
  filepath: data/08_reporting/protein_alignment_results.csv
